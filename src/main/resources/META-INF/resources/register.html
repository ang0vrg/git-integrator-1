<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="my-register">
        <h2>Crear Cuenta</h2>
        <p>Regístrate para comprar y acumular puntos con tus pedidos</p>

        <div class="my-formbox">
            <!-- FORMULARIO REGISTRO -->
            <form action="/auth/register" method="POST" class="my-input">

                <!-- Nombre -->
                <div class="c-input-item">
                    <label for="firstName">Nombre <em class="required">*</em></label>
                    <input  type="text"
                            id="firstName"
                            name="firstName"
                            placeholder="Tu nombre"
                            maxlength="50"
                            required>
                </div>

                <!-- Apellido -->
                <div class="c-input-item">
                    <label for="lastName">Apellido <em class="required">*</em></label>
                    <input  type="text"
                            id="lastName"
                            name="lastName"
                            placeholder="Tu apellido"
                            maxlength="50"
                            required>
                </div>

                <!-- Correo -->
                <div class="c-input-item">
                    <label for="email">Correo Electrónico <em class="required">*</em></label>
                    <input  type="email"
                            id="email"
                            name="email"
                            placeholder="Tu correo electrónico"
                            autocomplete="email"
                            required>
                </div>

                <!-- Celular -->
                <div class="c-input-item">
                    <label for="phone">Celular</label>
                    <input  type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Tu número de celular"
                            maxlength="20">
                </div>

                <!-- Contraseña -->
                <div class="c-input-item">
                    <label for="password">Contraseña <em class="required">*</em></label>
                    <input  type="password"
                            id="password"
                            name="password"
                            placeholder="Tu contraseña"
                            autocomplete="new-password"
                            minlength="8"
                            required>
                </div>

                <!-- Confirmar contraseña -->
                <div class="c-input-item">
                    <label for="confirmPassword">Confirmar Contraseña <em class="required">*</em></label>
                    <input  type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repite tu contraseña"
                            autocomplete="new-password"
                            required>
                </div>

                <!-- Botón -->
                <div class="my-register__button">
                    <button type="submit">Registrarse</button>
                </div>
            </form>
        </div>
        <p>¿Ya tienes una cuenta? <a href="/login.html">Inicia sesión aquí</a></p>
    </div>
    <div id="message-popup"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('registrationForm');
            const popup = document.getElementById('message-popup');

            form.addEventListener('submit', async (event) => {
                event.preventDefault(); // Detiene el envío del formulario por defecto

                const formData = new FormData(form);
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: new URLSearchParams(formData),
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                });

                const message = await response.text();
                popup.textContent = message;
                
                if (response.ok) {
                    popup.style.backgroundColor = 'green';
                    // Limpia el formulario
                    form.reset();
                } else {
                    popup.style.backgroundColor = 'red';
                }

                popup.classList.add('show');
                setTimeout(() => {
                    popup.classList.remove('show');
                }, 4000); // El popup desaparece después de 4 segundos
            });
        });
    </script>
</body>
</html>
