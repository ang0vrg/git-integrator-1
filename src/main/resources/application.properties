# Configuración de la conexión a la base de datos MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/bakerychantillydb
quarkus.datasource.username=root
quarkus.datasource.password=root

# Pool de conexiones (Agroal)
quarkus.datasource.jdbc.max-size=16

# Configuración de Hibernate ORM
#drop-and-create : Para el inicio de todo el proyecto; para la sincronización
#luego lo puedes cambiar a update
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Configuración del servidor
quarkus.http.port=8080
%dev.quarkus.dev.jvm.args=--add-opens java.base/java.lang=ALL-UNNAMED

# Configuración de JWT para GENERACIÓN (Uso Simétrico HMAC)
# Usamos 'secret-key' para especificar una clave secreta Base64.
smallrye.jwt.new-token.secret-key=QWqYwz4nJvKx9tFb8LpD7eS3r5H6gG2mO1fC4uXaZcY=
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.new-token.issuer=https://pasteleria.com

#--------------------------------------------------------------------------------
# Configuración de JWT para VERIFICACIÓN
#quarkus.smallrye-jwt.verify.key-value=${smallrye.jwt.new-token.secret-key}
#quarkus.smallrye-jwt.verify.signature-algorithm=HS256

#-----------------------PERMISOS PARA PETICIONES---------------------------------
# Habilita el soporte CORS
quarkus.http.cors=true

# Especifica los orígenes permitidos (URL de React/Vite)
quarkus.http.cors.origins=http://localhost:5173

# Especifica los métodos HTTP permitidos
quarkus.http.cors.methods=GET,POST,OPTIONS,DELETE,PUT

#Permite que el navegador envíe credenciales
quarkus.http.cors.access-control-allow-credentials=true


