# Configuración de la conexión a la base de datos MySQL
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/bakerychantillydb
quarkus.datasource.username=root
quarkus.datasource.password=admin

# Pool de conexiones (Agroal)
quarkus.datasource.jdbc.max-size=16

# Configuración de Hibernate ORM
#drop-and-create : Para el inicio de todo el proyecto; para la sincronización
#luego lo puedes cambiar a update
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# Habilita el manejo de CORS
quarkus.http.cors=true
# Especifica de qué orígenes (dominios/puertos) se aceptan peticiones
quarkus.http.cors.origins=http://localhost:3000

# Especifica qué métodos HTTP se permiten (GET, POST, etc.)
quarkus.http.cors.methods=GET,PUT,POST,DELETE,OPTIONS

# Especifica qué cabeceras se permiten en las peticiones
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with

# Configuración del servidor
quarkus.http.port=8080
%dev.quarkus.dev.jvm.args=--add-opens java.base/java.lang=ALL-UNNAMED




# Configuración de JWT
mp.jwt.verify.publickey.location=classpath:META-INF/resources/publicKey.pem
mp.jwt.sign.key.location=classpath:META-INF/resources/privateKey.pem

mallrye.jwt.new-token.key.location=secret.key
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.new-token.issuer=https://pasteleria.com