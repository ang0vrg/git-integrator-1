# ============================================================================
# !CONFIGURACIÓN DE METRICAS (PROMETHEUS)
# ============================================================================
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ============================================================================
# !CONFIGURACIÓN DE BASE DE DATOS
# ============================================================================
quarkus.datasource.db-kind=mysql
#cambia a 3307 cuando uses docker 
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/bakerychantillydb
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.max-size=16
# ============================================================================
# !CONFIGURACIÓN DE HIBERNATE ORM
# ============================================================================
# Cambios entre update,drop-and-create,validate
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=false
quarkus.log.category."org.hibernate.tool.schema".level=ERROR
# ============================================================================
# !CONFIGURACIÓN DEL SERVIDOR
# ============================================================================
quarkus.http.port=8080
# ============================================================================
# !CONFIGURACIÓN JWT - GENERACIÓN (para crear tokens)
# ============================================================================
# smallrye.jwt.new-token.key.location=private.key
# smallrye.jwt.new-token.signature-algorithm=RS256
# smallrye.jwt.new-token.issuer=https://pasteleria.com
# ============================================================================
# !CONFIGURACIÓN JWT - VALIDACIÓN (para proteger endpoints)
# ============================================================================
mp.jwt.verify.publickey.location=classpath:publicKey.pem
mp.jwt.verify.issuer=https://pasteleria.com
quarkus.smallrye-jwt.enabled=true
# ============================================================================
# !CONFIGURACIÓN JWT - SESIONES (para guardar las sesiones)
# ============================================================================
smallrye.jwt.sign.key.location=classpath:privateKey.pem
smallrye.jwt.sign.algorithm=RS256
smallrye.jwt.sign.issuer=https://pasteleria.com
# ============================================================================
# !CONFIGURACIÓN CORS
# ============================================================================
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=authorization
# ============================================================================
# !CONFIGURACIÓN DEL MAILER
# ============================================================================
quarkus.mailer.from=${QUARKUS_MAILER_FROM}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME}
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:587}
quarkus.mailer.tls=true
quarkus.mailer.auth-methods=LOGIN
quarkus.mailer.mock=false
# ============================================================================
# !CONFIGURACIÓN DE LOGGING
# ============================================================================
quarkus.log.level=INFO
quarkus.log.console.level=INFO
quarkus.log.min-level=INFO
quarkus.banner.enabled=true
quarkus.log.console.json=false
quarkus.log.console.color=true
quarkus.log.category."io.quarkus.config".level=ERROR
quarkus.log.category."io.vertx.core.logging".level=WARN
quarkus.log.category."io.quarkus.mailer".level=INFO
quarkus.log.category."io.vertx.mailclient".level=INFO
quarkus.log.category."io.vertx".level=WARN
