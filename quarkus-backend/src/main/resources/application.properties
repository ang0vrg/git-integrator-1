# ============================================================================
# CONFIGURACIÓN DE BASE DE DATOS
# ============================================================================
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/bakerychantillydb
quarkus.datasource.username=root
quarkus.datasource.password=root
quarkus.datasource.jdbc.max-size=16

# ============================================================================
# CONFIGURACIÓN DE HIBERNATE ORM
# ============================================================================
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true
#drop-and-create : Para el inicio de todo el proyecto; para la sincronización
#luego lo puedes cambiar a update

# ============================================================================
# CONFIGURACIÓN DEL SERVIDOR
# ============================================================================
# If 8080 is already in use on the host, use 8081 for local dev to avoid conflicts
quarkus.http.port=8081
quarkus.jvm.args=--add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.util=ALL-UNNAMED

# ============================================================================
# CONFIGURACIÓN JWT - GENERACIÓN (para crear tokens)
# ============================================================================
smallrye.jwt.new-token.key.location=secret.key
smallrye.jwt.new-token.signature-algorithm=HS256
smallrye.jwt.new-token.issuer=https://pasteleria.com

#-----------------------PERMISOS PARA PETICIONES---------------------------------
# Habilita el soporte CORS
quarkus.http.cors=true
# Especifica los orígenes permitidos (URL de React/Vite)
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
# Expose Content-Range so browser clients (react-admin) can read it for pagination
quarkus.http.cors.exposed-headers=Content-Range,Content-Type,Authorization

# ==============================
# 📧 CONFIGURACIÓN DEL MAILER
# ==============================
## Mailer defaults for local development: provide a fallback sender and enable mock
# If you want to use a real SMTP server in dev, unset mock and set the
# QUARKUS_MAILER_* environment variables (or change these properties).
quarkus.mailer.from=${QUARKUS_MAILER_FROM:no-reply@localhost}
quarkus.mailer.username=${QUARKUS_MAILER_USERNAME:}
quarkus.mailer.password=${QUARKUS_MAILER_PASSWORD:}
quarkus.mailer.host=${QUARKUS_MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${QUARKUS_MAILER_PORT:465}
quarkus.mailer.ssl=${QUARKUS_MAILER_SSL:true}
quarkus.mailer.auth-methods=LOGIN
# Enable mock mailer locally so Quarkus won't try to connect to a real SMTP server
# Change to 'false' when you configure a real SMTP account or production.
quarkus.mailer.mock=true

# Debug
quarkus.log.category."io.quarkus.mailer".level=DEBUG
quarkus.log.category."io.vertx.mailclient".level=DEBUG
quarkus.log.category."io.vertx".level=DEBUG