<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Productos</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <div class="logo">Mi Tienda</div>
    <nav>
      <ul>
        <li><a href="#">Inicio</a></li>
        <li><a href="#">Productos</a></li>
        <li><a href="#">Nosotros</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
    </nav>
    <div class="buscador">
      <input type="text" placeholder="Buscar...">
      <button>🔍</button>
    </div>
    <div class="acciones">
      <a href="#">Cuenta</a>
      <a href="#">🛒</a>
    </div>
  </header>

  <main>
    <section class="catalogo">
      <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto 1">
        <h3>Producto 1</h3>
        <p>$20.00</p>
      </div>
      <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto 2">
        <h3>Producto 2</h3>
        <p>$25.00</p>
      </div>
      <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto 3">
        <h3>Producto 3</h3>
        <p>$30.00</p>
      </div>
      <div class="producto">
        <img src="https://via.placeholder.com/200" alt="Producto 4">
        <h3>Producto 4</h3>
        <p>$35.00</p>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2025 Mi Tienda. Todos los derechos reservados.</p>
  </footer>
</body>
</html>
